[pytest]
pythonpath =
    apps/api
    apps/api/tests
testpaths = apps/api/tests
addopts = -q
markers =
    invariant: asserts one of the INVARIANT-00x rules in docs/IMPLEMENTATION_PLAN.md
    adversarial: hostile input — prompt injection, tampering, bypass attempts
filterwarnings =
    ignore::DeprecationWarning:fastapi.*
